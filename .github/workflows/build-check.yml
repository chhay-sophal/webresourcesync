name: Build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: windows
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            artifact-name: macos
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-latest
            artifact-name: linux
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build sidecar
        run: npm run prepare-sidecar --workspace server

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: webresourcesync-installer-${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 30
